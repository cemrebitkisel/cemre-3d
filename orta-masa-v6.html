// instead of floating ~12 cm above it as in V29.
const trayFloor=.907, trayRim=.975, trayWall=.008;
// Thin recessed floor: no tall solid side apron; the real trays sit in a light oak frame.
block(sx,trayFloor-.011,sz,trayWidth-.012,.022,sd-.012,oakBody);
// Continuous slim oak perimeter conceals the seam between the cabinet and trays.
// A thin laminated band is intentional; there is no unsupported wood apron.
for (const z of [binZ+.012,binZ+sd-.012])
 block(sx,.898,z,trayWidth,.023,.024,oakFrame);
for (const x of [binX+.012,binX+trayWidth-.012])
 block(x,.898,sz,.024,.023,sd,oakFrame);
for(let ix=0;ix<=8;ix++){
 const x=binX+ix*cellX;
 block(x,(trayFloor+trayRim)/2,sz,trayWall,trayRim-trayFloor,sd,oakInner);
}
for(let iz=0;iz<=4;iz++){
 const z=binZ+iz*cellZ;
 block(sx,(trayFloor+trayRim)/2,z,trayWidth,trayRim-trayFloor,trayWall,oakInner);
}
// Thin exterior rim; nothing resembling a 20cm-tall wooden box.
const topRimY=trayRim+.004;
for(const z of [binZ,binZ+sd])block(sx,topRimY,z,trayWidth+.016,.013,.018,oakTrim);
for(const x of [binX,binX+trayWidth])block(x,topRimY,sz,.018,.013,sd+.018,oakTrim);
// Transparent protection glazing sits above the trays with slim dark metal edging.
const glassBottom=.978,glassTop=1.178;
// Four separate glazing sections: two at 18.5cm and two at 20cm.
// The upper glass panels ride on staggered rails.
for(const z of [binZ-.012,binZ+sd+.012]){
 for(let i=0;i<4;i++){
  const w=trayWidth/4, x=binX+(i+.5)*w;
  const height=i%2===0?.185:.20;
  block(x,glassBottom+height/2,z,w-.003,height,.003,showcaseGlass);
  block(x,glassBottom+height,z,w-.004,.005,.007,metalEdge);
 }
}
for(const x of [binX-.012,binX+trayWidth+.012]){
 block(x,(glassBottom+glassTop)/2,sz,.003,glassTop-glassBottom,sd+.018,showcaseGlass);
 block(x,glassTop,sz,.006,.006,sd+.018,metalEdge);
}
// 4 sliding glass lids. Adjacent lids alternate between two subtly different tracks,
// so the panels can pass over one another (2 upper / 2 lower).
const lidW=trayWidth/4+.024;
for(let i=0;i<4;i++){
 const x=binX+(i+.5)*trayWidth/4;
 const raised=(i%2===1);
 const y=glassTop+(raised?.012:.003);
 block(x,y,sz,lidW,.006,sd-.018,showcaseGlass);
 // Visible, fine separation line marking each independently sliding lid.
 const railColor=raised?metalEdge:cabinetLine;
 block(x-lidW/2+.008,y+.003,sz,.004,.005,sd-.018,railColor);
}
// Two thin continuous runners and two top tracks (no oversized glass hood bars).
for(const z of [binZ-.004,binZ+sd+.004]){
 block(sx,glassTop+.008,z,trayWidth+.018,.007,.012,metalEdge);
}

document.getElementById('exportGLB').onclick=async()=>{
 const btn=document.getElementById('exportGLB');btn.disabled=true;btn.textContent='GLB hazırlanıyor…';
 try{
  const exporter=new GLTFExporter();
  // Export actual standalone model only; omit preview floor, lighting and merged duplicates.
  const exportGroup=new THREE.Group();exportGroup.name='Cemre_Orta_Masa_V6';
  model.updateMatrixWorld(true);
  for(const mesh of pieces){const clone=mesh.clone();clone.visible=true;exportGroup.add(clone);}
  const buffer=await exporter.parseAsync(exportGroup,{binary:true,onlyVisible:true,maxTextureSize:2048});
  const url=URL.createObjectURL(new Blob([buffer],{type:'model/gltf-binary'}));
  const a=document.createElement('a');a.href=url;a.download='Cemre_Orta_Masa_V6.glb';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
 }catch(err){console.error(err);alert('GLB oluşturulamadı: '+err.message)}
 finally{btn.disabled=false;btn.textContent='GLB olarak indir';}
};
const originals=[...pieces];const grouped=new THREE.Group();model.add(grouped);
const byMaterial=new Map();for(const mesh of originals){if(mesh.material.transparent || mesh.material.transmission>0)continue;const a=byMaterial.get(mesh.material)||[];a.push(mesh);byMaterial.set(mesh.material,a)}
for(const [material,meshes] of byMaterial){const geometries=meshes.map(mesh=>{mesh.updateMatrix();const geo=mesh.geometry.clone();geo.applyMatrix4(mesh.matrix);return geo});const merged=mergeGeometries(geometries,false);if(!merged)throw Error('Geometri birleştirilemedi');const combined=new THREE.Mesh(merged,material);combined.castShadow=true;combined.receiveShadow=true;grouped.add(combined);}
const transparent=originals.filter(m=>m.material.transparent || m.material.transmission>0);
function setOptimized(on){for(const m of originals)m.visible=!on || transparent.includes(m);grouped.visible=on;document.querySelector('#mode').textContent=on?'Optimize geometri':'Standart geometri';document.querySelector('#toggle').textContent=on?'Orijinal sürüme geç':'Optimize edilmiş sürüme geç';}
let optimized=false;setOptimized(false);document.querySelector('#toggle').onclick=()=>{optimized=!optimized;setOptimized(optimized)};
document.querySelector('#reset').onclick=()=>{camera.position.set(2.9,2.3,3.4);controls.target.set(0,.67,0);controls.update()};
function changeView(action){
  if(action==='reset'){document.querySelector('#reset').click();return;}
  const offset=camera.position.clone().sub(controls.target);
  if(action==='near'||action==='far'){
    const factor=action==='near'?0.82:1.22;
    const next=Math.max(1.65,Math.min(12,offset.length()*factor));
    offset.setLength(next);
  }else if(action==='left'||action==='right'){
    const angle=action==='left'?-0.16:0.16;
    offset.applyAxisAngle(new THREE.Vector3(0,1,0),angle);
  }
  camera.position.copy(controls.target).add(offset);
  controls.update();
}
for(const name of ['near','far','left','right'])document.getElementById(name).addEventListener('click',()=>changeView(name));
addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;
  const map={w:'near',s:'far',a:'left',d:'right',r:'reset',ArrowUp:'near',ArrowDown:'far',ArrowLeft:'left',ArrowRight:'right'};
  const action=map[e.key]||map[e.key.toLowerCase?.()];
  if(action){e.preventDefault();changeView(action);}
});

let frames=0,last=performance.now(),fps=0;function tick(t){requestAnimationFrame(tick);controls.update();renderer.render(scene,camera);frames++;if(t-last>=650){fps=Math.round(frames*1000/(t-last));frames=0;last=t;const info=renderer.info.render;document.querySelector('#stats').textContent=`${fps} FPS · ${info.calls} çizim · ${info.triangles} üçgen`;}}requestAnimationFrame(tick);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></html>
