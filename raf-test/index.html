<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cemre - 3D Tuz Lambası Rafı</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #eeeeea;
  }
  #bilgi {
    position: absolute;
    top: 15px;
    left: 15px;
    background: rgba(255,255,255,.9);
    padding: 12px;
    border-radius: 8px;
    z-index: 10;
  }
  #hata {
    color: #a00000;
    font-size: 13px;
    margin-top: 8px;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="bilgi">
  <strong>CEMRE - 3D TUZ LAMBASI RAFI</strong><br>
  221 × 36 × 203 cm<br>
  <small>Fareyle veya parmağınla döndürebilirsin.</small>
  <div id="hata"></div>
</div>

<script type="module">
try {
  const THREE = await import("three");

  const { OrbitControls } = await import(
    "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js"
  );

  const { GLTFLoader } = await import(
    "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js"
  );

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xeeeeea);

  const camera = new THREE.PerspectiveCamera(
    40,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );

  camera.position.set(3.5, 2.5, 4.5);

  const renderer = new THREE.WebGLRenderer({
    antialias: false,
    powerPreference: "low-power"
  });

  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.3));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1, 0);
  controls.enableDamping = true;
  controls.update();

  scene.add(new THREE.HemisphereLight(0xffffff, 0x999999, 2));

  const light = new THREE.DirectionalLight(0xffffff, 2);
  light.position.set(3, 6, 5);
  scene.add(light);

  const loader = new GLTFLoader();

  loader.load(
    "../cemre_tuz_lambasi_rafi.glb",
    (gltf) => {
      scene.add(gltf.scene);
    },
    undefined,
    (error) => {
      document.getElementById("hata").textContent =
        "Raf yüklenemedi: " + error.message;
    }
  );

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

} catch (error) {
  document.getElementById("hata").textContent =
    "3D başlatılamadı: " + error.message;
}
</script>

</body>
</html>
