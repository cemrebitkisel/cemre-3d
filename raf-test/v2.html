<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Cemre | Tuz Lambası Rafı V2 – Materyal Karşılaştırma</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e7e6e2;color:#262626;font:15px system-ui,-apple-system,Segoe UI,sans-serif}canvas{display:block;touch-action:none}.top{position:absolute;z-index:3;top:12px;left:12px;right:12px;display:flex;gap:9px;justify-content:space-between;pointer-events:none}.card{pointer-events:auto;background:#ffffffed;border:1px solid #ddd;border-radius:10px;padding:11px 13px;box-shadow:0 2px 9px #0001}.card strong{font-size:16px}.sub{font-size:12px;color:#666;margin-top:4px}.bottom{position:absolute;bottom:13px;left:12px;right:12px;display:flex;align-items:end;justify-content:space-between;gap:8px;pointer-events:none}.bottom>*{pointer-events:auto}button{background:#282c29;color:white;border:0;border-radius:8px;padding:11px 13px;font-size:14px;cursor:pointer}button:focus-visible{outline:3px solid #68a7c4}.badge{font-size:12px;color:#454545}#error{position:absolute;top:98px;left:12px;right:12px;max-width:650px;z-index:6;background:#fff5f2;border:1px solid #b44;border-radius:8px;padding:14px;display:none;white-space:pre-wrap}#stage{height:100dvh;min-height:460px} .actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}@media(max-width:590px){.top{display:block}.card{margin-bottom:7px}.bottom{align-items:end}.badge{max-width:170px}.actions{max-width:175px}button{padding:10px}}</style>
</head><body><div id="stage"></div><div class="top"><div class="card"><strong>CEMRE · Tuz Lambası Rafı</strong><div class="sub">V2 · temiz meşe dokusu / mat ferforje · malzeme testi</div></div><div class="card"><strong>221 × 36 × 203 cm</strong><div class="sub">13 cm ayak · 5 açık meşe raf · 3 cm ferforje</div></div></div>
<div id="error" role="alert"></div><div class="bottom"><div class="card badge"><span id="fps">— FPS</span><br/>Parmakla döndür • İki parmakla yakınlaştır</div><div class="actions"><button id="swap">V1 ile karşılaştır</button><button id="reset">Görünümü sıfırla</button><button id="spin">Döndür: Kapalı</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script>
<script type="module">
try {
 const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js');
 const {OrbitControls}=await import('https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js');
 const {GLTFLoader}=await import('https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js');
 const host=document.getElementById('stage');
 const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.3));renderer.setSize(host.clientWidth,host.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;host.appendChild(renderer.domElement);
 const scene=new THREE.Scene();scene.background=new THREE.Color('#eeece7');
 const camera=new THREE.PerspectiveCamera(37,host.clientWidth/host.clientHeight,.025,70);
 const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;controls.target.set(0,1.02,0);controls.minDistance=1.15;controls.maxDistance=9;
 function reset(){camera.position.set(3.3,2.35,4.25);controls.target.set(0,1.02,0);controls.update()}reset();document.getElementById('reset').addEventListener('click',reset);
 let spin=false;document.getElementById('spin').addEventListener('click',(e)=>{spin=!spin;controls.autoRotate=spin;controls.autoRotateSpeed=.65;e.target.textContent='Döndür: '+(spin?'Açık':'Kapalı')});
 scene.add(new THREE.HemisphereLight(0xffffff,0xb6b0a3,2.05));const sun=new THREE.DirectionalLight(0xfff5e8,2.25);sun.position.set(-2,7,5);scene.add(sun);
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshBasicMaterial({color:0xe7e4df}));floor.rotation.x=-Math.PI/2;floor.position.y=-.008;scene.add(floor);
 const grid=new THREE.GridHelper(12,12,0xc9c4bb,0xded9d1);grid.position.y=-.004;scene.add(grid);
 let shelf=null, version=2;
 const loader=new GLTFLoader();
 async function changeModel(target){
   const path=target===2?'../cemre_tuz_lambasi_rafi_v2.glb':'../cemre_tuz_lambasi_rafi.glb';
   document.getElementById('swap').disabled=true;
   try {
    const gltf=await loader.loadAsync(path);
    if(shelf)scene.remove(shelf);
    shelf=gltf.scene;scene.add(shelf);version=target;
    document.getElementById('swap').textContent=version===2?'V1 ile karşılaştır':'V2’ye dön';
   }catch(e){const b=document.getElementById('error');b.style.display='block';b.textContent='Model yüklenemedi: '+(e.message||e);console.error(e)}
   finally{document.getElementById('swap').disabled=false}
 }
 document.getElementById('swap').addEventListener('click',()=>changeModel(version===2?1:2));
 await changeModel(2);
 let f=0,t=performance.now();function animate(now){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);f++;if(now-t>1200){document.getElementById('fps').textContent=Math.round(f*1000/(now-t))+' FPS';f=0;t=now}}requestAnimationFrame(animate);
 window.addEventListener('resize',()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)});
} catch(e){const box=document.getElementById('error');box.style.display='block';box.textContent='3D model yüklenemedi: '+(e.message||String(e))+'\nBu dosyayı GLB ile birlikte HTTPS üzerinde (GitHub Pages) yayımlayın.';console.error(e)}
</script></body></html>
